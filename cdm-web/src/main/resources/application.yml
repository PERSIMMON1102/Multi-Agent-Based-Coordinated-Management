server:
  port: 8080

spring:
  application:
    name: chronic-disease-platform
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cdm_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cdm_agent_logs?directConnection=true&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=5000}
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_REDIS_TIMEOUT:3s}

bootstrap:
  admin:
    enabled: ${INITIAL_ADMIN_ENABLED:true}
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    name: ${INITIAL_ADMIN_NAME:系统管理员}

llm:
  api:
    enabled: true
    base-url: ${LLM_API_BASE_URL:https://api.edgefn.net/v1}
    key: ${LLM_API_KEY:}
    model: ${LLM_API_MODEL:DeepSeek-V3.2}
    temperature: 0.7
    max-tokens: 2048

embedding:
  api:
    enabled: ${EMBEDDING_API_ENABLED:false}
    base-url: ${EMBEDDING_API_BASE_URL:${LLM_API_BASE_URL:https://api.edgefn.net/v1}}
    key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
    model: ${EMBEDDING_API_MODEL:text-embedding-3-small}
  dimension: ${EMBEDDING_DIMENSION:1536}

rerank:
  api:
    enabled: ${RERANK_API_ENABLED:false}
    base-url: ${RERANK_API_BASE_URL:${EMBEDDING_API_BASE_URL:${LLM_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1}}}
    key: ${RERANK_API_KEY:${EMBEDDING_API_KEY:${LLM_API_KEY:}}}
    model: ${RERANK_API_MODEL:qwen3-rerank}

vector:
  enabled: ${VECTOR_ENABLED:false}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    knowledge-collection: ${QDRANT_KNOWLEDGE_COLLECTION:knowledge_chunks}
    video-collection: ${QDRANT_VIDEO_COLLECTION:video_transcripts}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:cdm-avatars}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX:}

medplum:
  enabled: ${MEDPLUM_ENABLED:false}
  base-url: ${MEDPLUM_BASE_URL:https://api.medplum.com/}
  client-id: ${MEDPLUM_CLIENT_ID:}
  client-secret: ${MEDPLUM_CLIENT_SECRET:}
  project-id: ${MEDPLUM_PROJECT_ID:}
  access-token: ${MEDPLUM_ACCESS_TOKEN:}
  node-command: ${MEDPLUM_NODE_COMMAND:node}
  bridge-script-path: ${MEDPLUM_BRIDGE_SCRIPT_PATH:}
  mcp-base-url: ${MEDPLUM_MCP_BASE_URL:}
  timeout-seconds: ${MEDPLUM_TIMEOUT_SECONDS:45}
  transaction-bundle-enabled: ${MEDPLUM_TRANSACTION_BUNDLE_ENABLED:true}
  transaction-bundle-fallback-enabled: ${MEDPLUM_TRANSACTION_BUNDLE_FALLBACK_ENABLED:true}
  incremental-sync-enabled: ${MEDPLUM_INCREMENTAL_SYNC_ENABLED:true}
  patient-binding-watchdog:
    enabled: ${MEDPLUM_PATIENT_BINDING_WATCHDOG_ENABLED:true}
    initial-delay-ms: ${MEDPLUM_PATIENT_BINDING_WATCHDOG_INITIAL_DELAY_MS:120000}
    fixed-delay-ms: ${MEDPLUM_PATIENT_BINDING_WATCHDOG_FIXED_DELAY_MS:1800000}
    max-patients: ${MEDPLUM_PATIENT_BINDING_WATCHDOG_MAX_PATIENTS:50}

paper-case:
  ocr:
    provider: ${PAPER_CASE_OCR_PROVIDER:openai-compatible}
    api:
      base-url: ${PAPER_CASE_OCR_API_BASE_URL:${LLM_API_BASE_URL:https://api.openai.com/v1}}
      key: ${PAPER_CASE_OCR_API_KEY:${LLM_API_KEY:}}
      model: ${PAPER_CASE_OCR_API_MODEL:${LLM_API_MODEL:gpt-4.1-mini}}
    max-pages: ${PAPER_CASE_OCR_MAX_PAGES:5}
    baidu:
      app-id: ${BAIDU_OCR_APP_ID:}
      api-key: ${BAIDU_OCR_API_KEY:}
      secret-key: ${BAIDU_OCR_SECRET_KEY:}
      auth-url: ${BAIDU_OCR_AUTH_URL:https://aip.baidubce.com/oauth/2.0/token}
      endpoint: ${BAIDU_OCR_ENDPOINT:https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic}
  icd11:
    provider: ${PAPER_CASE_ICD11_PROVIDER:local-mapping}
    base-url: ${PAPER_CASE_ICD11_BASE_URL:https://id.who.int}
    token-url: ${PAPER_CASE_ICD11_TOKEN_URL:https://icdaccessmanagement.who.int/connect/token}
    client-id: ${WHO_ICD_CLIENT_ID:}
    client-secret: ${WHO_ICD_CLIENT_SECRET:}
    release-id: ${WHO_ICD_RELEASE:2026-01}
    linearization: ${WHO_ICD_LINEARIZATION:mms}
    language: ${WHO_ICD_LANGUAGE:zh}
    local:
      top-k: ${PAPER_CASE_ICD11_LOCAL_TOP_K:3}
      mapping-resource: ${PAPER_CASE_ICD11_LOCAL_MAPPING_RESOURCE:classpath:icd11/icd11-local-mapping-sample.csv}

auth:
  patient-registration-enabled: ${AUTH_PATIENT_REGISTRATION_ENABLED:true}
  jwt:
    secret: ${AUTH_JWT_SECRET:ChangeThisJwtSecretToAtLeast32CharsForProduction123456}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:43200}

logging:
  level:
    com.medical.agent: INFO
    org.hibernate.SQL: WARN
    org.mongodb.driver.cluster: WARN
    org.mongodb.driver.connection: WARN
    jade: WARN

jade:
  enabled: ${JADE_ENABLED:false}

security:
  field-encryption:
    key: ${CDM_FIELD_ENCRYPTION_KEY:}
    fail-on-missing-key: ${CDM_FIELD_ENCRYPTION_FAIL_ON_MISSING_KEY:false}
  upload-antivirus:
    enabled: ${UPLOAD_ANTIVIRUS_ENABLED:false}
    host: ${UPLOAD_ANTIVIRUS_HOST:localhost}
    port: ${UPLOAD_ANTIVIRUS_PORT:3310}
    timeout-ms: ${UPLOAD_ANTIVIRUS_TIMEOUT_MS:3000}
    fail-open: ${UPLOAD_ANTIVIRUS_FAIL_OPEN:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

orchestration:
  dispatch:
    max-parallelism: ${ORCHESTRATION_DISPATCH_MAX_PARALLELISM:2}
    pool:
      core-size: ${ORCHESTRATION_DISPATCH_POOL_CORE_SIZE:2}
      max-size: ${ORCHESTRATION_DISPATCH_POOL_MAX_SIZE:4}
      queue-capacity: ${ORCHESTRATION_DISPATCH_POOL_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${ORCHESTRATION_DISPATCH_POOL_KEEP_ALIVE_SECONDS:60}

clinical:
  assessment:
    provider: ${CLINICAL_ASSESSMENT_PROVIDER:react}
    react:
      notifications-enabled: ${CLINICAL_ASSESSMENT_REACT_NOTIFICATIONS_ENABLED:true}

clinical-data-job:
  pool:
    core-size: ${CLINICAL_DATA_JOB_POOL_CORE_SIZE:2}
    max-size: ${CLINICAL_DATA_JOB_POOL_MAX_SIZE:4}
    queue-capacity: ${CLINICAL_DATA_JOB_POOL_QUEUE_CAPACITY:64}
    keep-alive-seconds: ${CLINICAL_DATA_JOB_POOL_KEEP_ALIVE_SECONDS:60}
  alert-dedupe-window-ms: ${CLINICAL_DATA_JOB_ALERT_DEDUPE_WINDOW_MS:300000}
  retry:
    fixed-delay-ms: ${CLINICAL_DATA_JOB_RETRY_FIXED_DELAY_MS:60000}
  running-timeout-ms: ${CLINICAL_DATA_JOB_RUNNING_TIMEOUT_MS:1800000}
